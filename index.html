<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPEN SOURCE — a ledger of directives</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&family=Archivo:wght@500;600;700;800&family=Spline+Sans+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EAEDE9; --ink:#16211C; --seal:#1F5E3A; --amber:#B5651D; --verified:#1F5E3A;
  --slate:#59665E; --wash:#DDE2DA; --line:#C2CABF; --card:#F2F5EF; --danger:#8A2D3B; --danger-wash:#F3E2E4;
  --serif:"Newsreader", Georgia, serif;
  --sans:"Archivo", system-ui, sans-serif;
  --mono:"Spline Sans Mono", ui-monospace, "SF Mono", monospace;
}
*{box-sizing:border-box; margin:0}
html,body{height:100%}
body{background:var(--paper); color:var(--ink); font-family:var(--serif);
  background-image:radial-gradient(circle at 1px 1px, rgba(22,33,28,.05) 1px, transparent 0); background-size:22px 22px}
button{font-family:var(--sans); cursor:pointer; border:1px solid var(--ink); background:transparent; color:var(--ink);
  border-radius:2px; padding:6px 12px; font-size:12px; font-weight:600; letter-spacing:.04em; transition:background .15s,color .15s}
button:hover{background:var(--ink); color:var(--paper)}
button:focus-visible, a:focus-visible, input:focus-visible, textarea:focus-visible{outline:2px solid var(--seal); outline-offset:2px}
button.primary{background:var(--seal); border-color:var(--seal); color:#fff}
button.primary:hover{background:#164529}
button.amber{background:var(--amber); border-color:var(--amber); color:#fff}
button.amber:hover{background:#8F4E16}
button.ghost{border-color:var(--line); color:var(--slate)}
button.ghost:hover{background:var(--wash); color:var(--ink)}
button.danger{border-color:var(--line); color:var(--danger)}
button.danger:hover{background:var(--danger); border-color:var(--danger); color:#fff}
button.danger:disabled:hover{background:transparent; color:var(--danger)}
button:disabled{opacity:.45; cursor:not-allowed}
input,textarea{font-family:var(--serif); font-size:15px; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:2px; padding:9px 11px; width:100%}
textarea{resize:vertical; line-height:1.5}
.mono,input.mono{font-family:var(--mono); font-size:12px}
.eyebrow{font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--slate)}
.dim{color:var(--slate)}

#app{max-width:1280px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column}
header.top{display:flex; align-items:center; gap:16px; flex-wrap:wrap; padding:16px 24px 12px; border-bottom:2px solid var(--ink)}
.wordmark{font-family:var(--sans); font-weight:800; font-size:24px; letter-spacing:-.01em; cursor:pointer; display:inline-block; border-radius:2px}
.wordmark:hover em{color:var(--amber)}
.wordmark:focus-visible{outline:2px solid var(--seal); outline-offset:3px}
.wordmark em{font-style:normal; color:var(--seal); transition:color .15s}
.tagline{font-style:italic; color:var(--slate); font-size:14px; font-family:var(--serif)}
.spacer{flex:1}
.handle-chip{display:flex; align-items:center; gap:8px}
.handle-chip input{width:150px; padding:5px 8px; font-family:var(--mono); font-size:12px}
main.body{flex:1; display:flex; min-height:0}
nav.rail{width:310px; flex-shrink:0; border-right:1px solid var(--line); padding:18px 16px; overflow-y:auto; max-height:calc(100vh - 64px); position:sticky; top:0}
section.pane{flex:1; min-width:0; padding:24px 32px 120px}
@media (max-width:880px){ main.body{flex-direction:column} nav.rail{width:100%; max-height:none; position:static; border-right:none; border-bottom:1px solid var(--line)} section.pane{padding:20px 16px 120px} body.in-project nav.rail{display:none} }

.crumbs{display:flex; align-items:center; gap:10px; flex-wrap:wrap; margin-bottom:16px; font-family:var(--sans); font-size:12px; font-weight:600}
.crumbs .sep{color:var(--line)} .crumbs a{color:var(--seal); text-decoration:none; border-bottom:1px solid transparent}
.crumbs a:hover{border-bottom-color:var(--seal)}
.crumbs .here{color:var(--slate); font-weight:500; font-style:italic; font-family:var(--serif); font-size:14px; max-width:36ch; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}

.rail-head{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:12px}
.proj-card{display:block; width:100%; text-align:left; border:1px solid var(--line); background:var(--card); border-radius:2px; padding:12px 14px; margin-bottom:10px; font-family:var(--serif)}
.proj-card:hover{background:var(--wash); color:var(--ink)}
.proj-card .t{font-family:var(--sans); font-size:15px; font-weight:700; margin-bottom:4px}
.proj-card .m{font-family:var(--sans); font-size:11px; color:var(--slate); display:flex; gap:10px; flex-wrap:wrap; font-weight:500}
.proj-card.local{border-left:3px solid var(--slate)} .proj-card.pub{border-left:3px solid var(--seal)}
.proj-card.seed{border-left:3px solid var(--amber)}
.proj-card.active{border-left-width:2px; border-left-color:var(--seal); background:var(--wash); box-shadow:inset 3px 0 0 var(--seal)}
.badge{display:inline-block; font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.1em; padding:1px 6px; border:1px solid currentColor; border-radius:2px}
.badge.fork{color:var(--amber)} .badge.seed{color:var(--amber)} .badge.repo{color:var(--seal)}
.empty{border:1px dashed var(--line); padding:16px; color:var(--slate); font-style:italic; border-radius:2px; font-size:14px}

.proj-title{font-family:var(--sans); font-size:30px; font-weight:800; line-height:1.05; letter-spacing:-.015em}
.repo-link{font-family:var(--mono); font-size:13px; color:var(--seal); text-decoration:none; border-bottom:1px solid var(--line)}
.repo-link:hover{border-color:var(--seal)}
.proj-sub{display:flex; align-items:center; gap:12px; margin-top:10px; flex-wrap:wrap}
.verify-banner{display:flex; align-items:center; gap:10px; font-family:var(--sans); font-size:12px; font-weight:600; padding:8px 12px; border-radius:2px; margin:14px 0}
.verify-banner.ok{background:#E0EBE3; color:var(--verified); border:1px solid var(--verified)}
.verify-banner.bad{background:var(--danger-wash); color:var(--danger); border:1px solid var(--danger)}

/* directive nodes */
.dir{display:flex; gap:14px; padding:18px 0; border-bottom:1px solid var(--line); scroll-margin-top:20px}
.seal-col{flex-shrink:0; width:42px; display:flex; flex-direction:column; align-items:center; gap:6px}
.seal{width:38px; height:38px; cursor:pointer}
.chain-tail{flex:1; width:1px; background:var(--line); min-height:14px}
.dir-main{flex:1; min-width:0}
.dir-meta{display:flex; align-items:baseline; gap:10px; margin-bottom:6px; flex-wrap:wrap}
.dir-n{font-family:var(--sans); font-size:11px; font-weight:800; letter-spacing:.1em; color:var(--seal); text-transform:uppercase}
.dir-branch{font-family:var(--mono); font-size:12px; background:var(--wash); padding:1px 8px; border-radius:2px; color:var(--ink)}
.gh-state{font-family:var(--sans); font-size:10.5px; font-weight:700; letter-spacing:.06em; padding:1px 7px; border-radius:2px}
.gh-state.verified{background:#E0EBE3; color:var(--verified); border:1px solid var(--verified)}
.gh-state.missing{background:var(--danger-wash); color:var(--danger); border:1px solid var(--danger)}
.gh-state.unchecked{background:var(--wash); color:var(--slate); border:1px solid var(--line)}
.dir-prompt{font-family:var(--mono); font-size:13px; line-height:1.5; background:var(--card); border:1px solid var(--line); border-left:3px solid var(--seal); border-radius:2px; padding:11px 13px; white-space:pre-wrap; overflow-wrap:break-word; margin-bottom:8px}
.dir-why{font-size:15px; line-height:1.6; overflow-wrap:break-word}
.dir-why .lbl{font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--slate); text-transform:uppercase; display:block; margin-bottom:2px}
.dir-actions{display:flex; gap:6px; margin-top:12px; flex-wrap:wrap}
.dir-actions button{padding:3px 9px; font-size:10.5px}
.dir-target{font-family:var(--sans); font-size:11px; color:var(--slate); margin-top:6px}
.dir-target a{color:var(--seal)}

/* chain view */
.chain-row{display:flex; gap:12px; align-items:flex-start; padding:12px 0; border-bottom:1px solid var(--line)}
.chain-detail{flex:1; min-width:0}
.chain-detail .lbl{font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--slate); text-transform:uppercase; margin-top:6px}
.chain-detail .mono{word-break:break-all; color:var(--slate)}
.excerpt{font-style:italic; color:var(--slate); font-size:13px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:56ch}

.toggle{display:inline-flex; border:1px solid var(--ink); border-radius:2px; overflow:hidden}
.toggle button{border:none; border-radius:0; padding:6px 14px}
.toggle button.on{background:var(--ink); color:var(--paper)}

/* composer */
.composer{border-top:2px solid var(--ink); padding:16px 0 0; margin-top:24px}
.composer .grid{display:grid; gap:10px}
.field label{font-family:var(--sans); font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--slate); display:block; margin-bottom:4px}
.branch-row{display:flex; gap:8px} .branch-row input{flex:1}
.hint{font-family:var(--sans); font-size:11px; color:var(--slate); margin-top:6px}

/* margin notes + notebook (private, unchained) */
.bloat-warn{border:1px solid var(--amber); background:#F6F1E7; color:#8F4E16; font-family:var(--sans); font-size:12.5px; font-weight:600; padding:9px 13px; border-radius:2px; margin:14px 0; display:flex; gap:10px; align-items:center; flex-wrap:wrap}
.bloat-warn button{font-size:11px; padding:4px 10px}
.graph-wrap{background:var(--card); border:1px solid var(--line); border-radius:2px; padding:16px; margin-top:16px; overflow-x:auto}
.graph-legend{display:flex; gap:14px; flex-wrap:wrap; font-family:var(--sans); font-size:10.5px; color:var(--slate); margin-bottom:10px}
.graph-legend span{display:flex; align-items:center; gap:5px}
.graph-legend i{width:10px; height:10px; border-radius:2px; display:inline-block}
.gph-node:hover{cursor:pointer}
.archived-tag{font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.08em; color:var(--slate); border:1px solid var(--line); padding:1px 6px; border-radius:2px}
.checklist{margin-top:26px; border:1px solid var(--line); background:var(--card); border-radius:2px; padding:16px 18px}
.checklist h4{font-family:var(--sans); font-size:12px; font-weight:800; letter-spacing:.08em; text-transform:uppercase; color:var(--slate); margin-bottom:4px}
.checklist .cl-sub{font-family:var(--sans); font-size:11px; color:var(--slate); margin-bottom:12px}
.cl-item{display:flex; gap:10px; align-items:flex-start; padding:8px 0; border-top:1px solid var(--line); cursor:pointer}
.cl-item:first-of-type{border-top:none}
.cl-box{flex-shrink:0; width:20px; height:20px; border:2px solid var(--slate); border-radius:3px; display:flex; align-items:center; justify-content:center; margin-top:1px; transition:background .12s, border-color .12s}
.cl-item.done .cl-box{background:var(--seal); border-color:var(--seal)}
.cl-box svg{opacity:0} .cl-item.done .cl-box svg{opacity:1}
.cl-text{font-size:14.5px; line-height:1.45}
.cl-item.done .cl-text{color:var(--slate); text-decoration:line-through}
.cl-progress{font-family:var(--sans); font-size:11px; font-weight:700; color:var(--seal); margin-top:10px}
.stat-box{border:1px solid var(--line); background:var(--card); border-radius:2px; padding:12px 18px; text-align:center; min-width:92px}
.stat-box .sn{font-family:var(--sans); font-weight:800; font-size:26px; color:var(--seal)}
.stat-box .sl{font-family:var(--sans); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--slate); margin-top:2px}
.phase-tag{font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; background:var(--wash); color:var(--slate); padding:1px 8px; border-radius:2px}
.margin-note{margin-top:10px; border-left:3px solid var(--amber); background:#F6F1E7; border-radius:2px; padding:9px 12px}
.margin-note .lbl{font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--amber); text-transform:uppercase; display:block; margin-bottom:3px}
.margin-note textarea{background:transparent; border:none; padding:0; font-size:14px; font-style:italic; min-height:40px; width:100%}
.margin-note textarea:focus-visible{outline:none}
.notebook textarea{min-height:340px; font-size:15px; line-height:1.7; background:var(--card)}
.notebook .meta{font-family:var(--sans); font-size:11px; color:var(--slate); margin-top:8px; display:flex; justify-content:space-between; flex-wrap:wrap; gap:8px}
.private-tag{font-family:var(--sans); font-size:10px; font-weight:700; letter-spacing:.1em; color:var(--amber); border:1px solid var(--amber); padding:1px 7px; border-radius:2px}

.scrim{position:fixed; inset:0; background:rgba(22,33,28,.45); display:flex; align-items:center; justify-content:center; z-index:50; padding:16px}
.dialog{background:var(--paper); border:2px solid var(--ink); border-radius:2px; max-width:540px; width:100%; padding:22px; max-height:90vh; overflow-y:auto}
.dialog h3{font-family:var(--sans); font-size:20px; font-weight:800; margin-bottom:10px}
.dialog p{font-size:14px; line-height:1.5; margin-bottom:8px}
.dialog .field{margin-bottom:12px}
.dialog .btns{display:flex; gap:10px; justify-content:flex-end; margin-top:14px}
.mono-box{background:var(--card); border:1px solid var(--line); padding:9px; font-family:var(--mono); font-size:11px; word-break:break-all}
#toast{position:fixed; bottom:22px; left:50%; transform:translateX(-50%); background:var(--ink); color:var(--paper); font-family:var(--sans); font-size:13px; font-weight:600; padding:10px 18px; border-radius:2px; z-index:60; display:none; max-width:90vw}
.spin{display:inline-block; width:12px; height:12px; border:2px solid currentColor; border-top-color:transparent; border-radius:50%; animation:sp .7s linear infinite; vertical-align:-2px; margin-right:5px}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){ .spin{animation-duration:1.4s} }
.collapsed-warning{border:1px solid var(--danger); background:var(--danger-wash); padding:16px; border-radius:2px; margin:16px 0}
.collapsed-warning .eyebrow{color:var(--danger)}
.intro-card{border:1px solid var(--line); background:var(--card); border-radius:2px; padding:16px 18px; margin-top:16px}
.intro-card h4{font-family:var(--sans); font-size:14px; font-weight:800; margin-bottom:6px}
.intro-card p{font-size:14px; line-height:1.55; color:var(--slate)}
/* staged drafts (scan output — unchained until the user chains them) */
.draft-card{border:1px dashed var(--amber); background:var(--card); border-radius:2px; padding:14px 16px; margin-bottom:12px}
.draft-card .eyebrow{color:var(--amber); display:block; margin-bottom:10px}
.scan-row{display:flex; gap:10px; align-items:flex-start; padding:9px 0; border-top:1px solid var(--line); cursor:pointer}
.scan-row:first-of-type{border-top:none}
.scan-row input[type=checkbox]{width:auto; margin-top:3px; accent-color:var(--seal)}
.scan-row .b{font-family:var(--mono); font-size:12px; word-break:break-all}
.scan-row .c{font-style:italic; color:var(--slate); font-size:12.5px; margin-top:2px}
/* dependency tags (unchained metadata on directives) */
.dep-chip{display:inline-block; font-family:var(--mono); font-size:10.5px; background:var(--wash); border:1px solid var(--line); border-radius:2px; padding:0 6px; margin:2px 6px 0 0}
.dep-chip b{cursor:pointer; font-weight:600; color:var(--slate); margin-left:4px}
.dep-chip b:hover{color:var(--danger)}
input.dep-add{font-family:var(--mono); font-size:10.5px; width:160px; padding:2px 7px; display:inline-block; background:var(--card); border:1px dashed var(--line); vertical-align:middle}
.pkg-legend{display:flex; gap:6px; flex-wrap:wrap; align-items:center; margin-top:12px}
.pkg-legend button{font-family:var(--mono); font-size:10.5px; padding:2px 8px; letter-spacing:0}
.dep-e{opacity:.35; transition:opacity .15s}
.dep-e.hl{opacity:1}
.map-sel{cursor:pointer}
.brief-box{white-space:pre-wrap; word-break:normal; overflow-wrap:break-word; max-height:52vh; overflow-y:auto; font-size:11.5px; line-height:1.6}
</style>
</head>
<body>
<div id="app">
  <header class="top">
    <div>
      <div class="wordmark" role="button" tabindex="0" aria-label="Home — return to the ledger" title="Home" onclick="OS.goFeed()" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();OS.goFeed()}">OPEN <em>SOURCE</em></div>
      <div class="tagline">Every directive is a node. Map it to a branch, chain the reasoning — the ledger remembers why.</div>
    </div>
    <div class="spacer"></div>
    <button class="ghost" style="margin-right:10px" onclick="OS.guide()">Guide</button>
    <div class="handle-chip"><span class="eyebrow">Author</span>
      <input id="handle" maxlength="24" spellcheck="false" aria-label="Your handle"></div>
  </header>
  <main class="body">
    <nav class="rail" id="rail"></nav>
    <section class="pane" id="pane"></section>
  </main>
</div>
<div id="modal-root"></div>
<div id="toast" role="status"></div>

<script>
/* =====================================================================
   OPEN SOURCE — a hash-chained ledger of engineering directives.
   A directive = { prompt (what you told the agent), reasoning (why),
   target branch }. Directives chain like Group Chat nodes:
     content_hash = sha256(canonical(directive_body))
     chain_hash   = sha256(content_hash || parent_chain_hash)
   Publishing signs the chain head (ECDSA P-256; Ed25519 is the
   production target). Verification is FAIL-CLOSED. Branches can be
   live-checked against GitHub's public API (verify, don't trust).
   Two fork modes: branch-the-plan (alternative from a point) and
   clone-the-trail (adapt a whole project). Seeded with ONE real
   connected project; grows as users drop their own.
   ===================================================================== */
(() => {
"use strict";
/* ---------------- storage (GitHub Pages: localStorage) ----------------
   No persistent artifact API on Pages; use the browser localStorage instead.
   Published projects live under "proj:*" keys, personal state under LS_KEY,
   keypair under KP_KEY. Single origin: the "public ledger" is this browser's
   published projects. A real multi-user backend is the v2 upgrade; the
   chain/verify/fork mechanics are identical either way. */
const storage = {
  get: async (k) => { const v = localStorage.getItem(k); return v === null ? null : { value: v }; },
  set: async (k, v) => { localStorage.setItem(k, v); return { key: k }; },
  remove: async (k) => { localStorage.removeItem(k); return { key: k }; },
  list: async (prefix) => {
    const keys = [];
    for (let i = 0; i < localStorage.length; i++) { const key = localStorage.key(i); if (!prefix || key.startsWith(prefix)) keys.push(key); }
    return { keys };
  },
};
/* ---------------- drop-in config ----------------
   UNIVERSAL (default): PINNED_REPO = null. Runs standalone; users create
   projects and name any public repo per project.
   DROP-IN: set PINNED_REPO to "owner/name" (or auto-detect from the Pages
   URL below) and this ledger focuses on that one repo — new projects
   pre-fill it, and the header shows it. Drop this file into any repo's
   /docs, set the one line, enable Pages. Same file, two modes. */
const PINNED_REPO = (() => {
  const MANUAL = null; // e.g. "holeyfield33-art/horos" to pin; leave null for universal
  if (MANUAL) return MANUAL;
  // Auto-detect: on a project Pages site (owner.github.io/repo/), infer owner/repo.
  try {
    const host = location.hostname, parts = location.pathname.split("/").filter(Boolean);
    const m = host.match(/^([^.]+)\.github\.io$/);
    if (m && parts.length) return m[1] + "/" + parts[0];
  } catch (e) {}
  return null;
})();
const PINNED_REPO_URL = PINNED_REPO ? "https://github.com/" + PINNED_REPO : "";
const GENESIS = "0".repeat(64);
const LS_KEY = "os-local-v1";
const KP_KEY = "os-key-v1";
const enc = new TextEncoder();
const $ = (id) => document.getElementById(id);

/* ---------------- crypto ---------------- */
const hex = (buf) => [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
async function sha256hex(s) { return hex(await crypto.subtle.digest("SHA-256", enc.encode(s))); }
/* canonical directive body: stable key order so the hash is deterministic */
function canonicalBody(d) { return JSON.stringify([d.prompt, d.reasoning, d.branch]); }
async function contentHash(d) { return sha256hex(canonicalBody(d)); }
async function chainHash(cH, parent) { return sha256hex(cH + parent); }

const ECDSA = { name: "ECDSA", namedCurve: "P-256" };
const SIGN = { name: "ECDSA", hash: "SHA-256" };
async function loadOrCreateKeypair() {
  try {
    const r = await storage.get(KP_KEY);
    if (r && r.value) {
      const jwk = JSON.parse(r.value);
      return { priv: await crypto.subtle.importKey("jwk", jwk.priv, ECDSA, true, ["sign"]),
        pub: await crypto.subtle.importKey("jwk", jwk.pub, ECDSA, true, ["verify"]), pubJwk: jwk.pub };
    }
  } catch (e) {}
  const kp = await crypto.subtle.generateKey(ECDSA, true, ["sign", "verify"]);
  const priv = await crypto.subtle.exportKey("jwk", kp.privateKey);
  const pub = await crypto.subtle.exportKey("jwk", kp.publicKey);
  try { await storage.set(KP_KEY, JSON.stringify({ priv, pub })); }
  catch (e) { console.error("keypair not persisted:", e); }
  return { priv: kp.privateKey, pub: kp.publicKey, pubJwk: pub };
}
async function signHex(privKey, s) { return hex(await crypto.subtle.sign(SIGN, privKey, enc.encode(s))); }
async function verifySig(pubJwk, s, sigHex) {
  try {
    const key = await crypto.subtle.importKey("jwk", pubJwk, ECDSA, true, ["verify"]);
    const sig = new Uint8Array(sigHex.match(/.{2}/g).map(h => parseInt(h, 16)));
    return crypto.subtle.verify(SIGN, key, sig, enc.encode(s));
  } catch (e) { return false; }
}
async function verifyRecord(rec) {
  let parent = rec.forkOf ? rec.forkOf.chainHash : GENESIS;
  let chainOk = true;
  for (const d of rec.directives) {
    const cH = await contentHash(d);
    const chH = await chainHash(cH, parent);
    if (cH !== d.contentHash || chH !== d.chainHash) { chainOk = false; break; }
    parent = chH;
  }
  const head = rec.directives.length ? rec.directives[rec.directives.length - 1].chainHash : parent;
  let sigOk = false;
  if (rec.sig && rec.pubkey) sigOk = await verifySig(rec.pubkey, head, rec.sig);
  return { chainOk, sigOk, head };
}

/* ---------------- state ---------------- */
const state = {
  local: { projects: {}, order: [], handle: "", seeded: false },
  feed: [], verif: {},
  view: "feed", openId: null, openIsPub: false, paneMode: "directives",
  ghCache: {}, // "owner/repo@branch" -> {state, sha, url}
  kp: null,
};
async function saveLocal() {
  try { await storage.set(LS_KEY, JSON.stringify(state.local)); }
  catch (e) { toast("Local save failed — storage offline."); console.error(e); }
}
async function loadLocal() {
  try { const r = await storage.get(LS_KEY); if (r && r.value) state.local = JSON.parse(r.value); }
  catch (e) {}
}
async function loadFeed() {
  state.feed = [];
  let keys = [];
  try { const r = await storage.list("proj:"); keys = (r && r.keys) || []; }
  catch (e) { console.error("feed unavailable:", e); return; }
  const loaded = [];
  for (const k of keys) {
    try {
      const r = await storage.get(k);
      if (r && r.value) loaded.push(JSON.parse(r.value));
    } catch (e) {}
  }
  loaded.sort((a, b) => (b.publishedAt || 0) - (a.publishedAt || 0));
  for (const rec of loaded.slice(0, 20)) {
    state.feed.push(rec);
    state.verif[rec.id] = await verifyRecord(rec);
  }
}
function forkCount(projId) { return state.feed.filter(r => r.forkOf && r.forkOf.projId === projId).length; }

/* ---------------- github verify (public API, CORS-open) ---------------- */
function parseRepo(url) {
  const m = String(url).match(/github\.com[/:]([^/]+)\/([^/#?]+?)(?:\.git)?(?:$|[/#?])/);
  return m ? { owner: m[1], repo: m[2] } : null;
}
async function checkBranch(repoUrl, branch) {
  const r = parseRepo(repoUrl);
  if (!r || !branch) return { state: "unchecked" };
  const cacheKey = r.owner + "/" + r.repo + "@" + branch;
  if (state.ghCache[cacheKey]) return state.ghCache[cacheKey];
  try {
    // No custom headers: a bare GET is a CORS "simple request" and skips the
    // preflight entirely. GitHub's preflight does NOT allow a custom Accept
    // header, so adding one turns a working call into a blocked one.
    const res = await fetch("https://api.github.com/repos/" + r.owner + "/" + r.repo + "/branches/" + encodeURIComponent(branch));
    if (res.status === 404) {
      const repoRes = await fetch("https://api.github.com/repos/" + r.owner + "/" + r.repo).catch(() => null);
      if (repoRes && repoRes.status === 404) { const v = { state: "missing", reason: "repo not found (private or renamed?)" }; state.ghCache[cacheKey] = v; return v; }
      const v = { state: "missing", reason: "branch '" + branch + "' not found in this repo" }; state.ghCache[cacheKey] = v; return v;
    }
    if (res.status === 403 || res.status === 429) {
      // Unauthenticated GitHub is 60 req/hr per IP. The reset time is in a header.
      let mins = "";
      const reset = res.headers.get("x-ratelimit-reset");
      if (reset) { const secs = Math.max(0, Math.round(+reset - Date.now() / 1000)); mins = " (resets in ~" + Math.ceil(secs / 60) + " min)"; }
      return { state: "unchecked", reason: "GitHub rate limit hit — 60 checks/hr without a token" + mins };
    }
    if (!res.ok) return { state: "unchecked", reason: "GitHub returned " + res.status };
    const data = await res.json();
    const v = { state: "verified", sha: data.commit && data.commit.sha, url: data.commit && data.commit.html_url };
    state.ghCache[cacheKey] = v; return v;
  } catch (e) { return { state: "unchecked", reason: "couldn't reach GitHub (network offline?)" }; }
}

/* ---------------- project ops ---------------- */
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
function newProject(title, repoUrl, forkOf, ancestry) {
  const p = { id: uid(), title: title || "Untitled project", repoUrl: repoUrl || "", createdAt: Date.now(),
    directives: [], forkOf: forkOf || null, ancestry: ancestry || null, publishedAt: null };
  state.local.projects[p.id] = p; state.local.order.unshift(p.id); return p;
}
async function appendDirective(proj, prompt, reasoning, branch) {
  const last = proj.directives[proj.directives.length - 1];
  const parent = last ? last.chainHash : (proj.forkOf ? proj.forkOf.chainHash : GENESIS);
  const body = { prompt, reasoning, branch };
  const cH = await contentHash(body);
  const chH = await chainHash(cH, parent);
  const d = { ...body, contentHash: cH, chainHash: chH, ts: Date.now() };
  proj.directives.push(d); return d;
}
async function publishProject(proj) {
  if (!proj.directives.length) throw new Error("add at least one directive before publishing");
  const head = proj.directives[proj.directives.length - 1].chainHash;
  const sig = await signHex(state.kp.priv, head);
  // Publish only chain-relevant fields. Private notes + journal never leave the device.
  const publicDirectives = proj.directives.map(d => ({
    prompt: d.prompt, reasoning: d.reasoning, branch: d.branch,
    contentHash: d.contentHash, chainHash: d.chainHash, ts: d.ts,
  }));
  const rec = { id: proj.id, title: proj.title, repoUrl: proj.repoUrl, author: state.local.handle,
    pubkey: state.kp.pubJwk, sig, headChain: head, createdAt: proj.createdAt, publishedAt: Date.now(),
    directives: publicDirectives, forkOf: proj.forkOf, ancestry: proj.ancestry, seed: proj.seed || false };
  // Stable key per project id: continuing and republishing overwrites this
  // same slot instead of piling up a new ledger entry every time. Recency
  // for the feed comes from sorting loaded records by publishedAt, not from
  // the key itself (see loadFeed).
  const key = "proj:" + rec.id;
  await storage.set(key, JSON.stringify(rec));
  proj.publishedAt = rec.publishedAt; await saveLocal(); return rec;
}
/* fork mode A: branch the plan from a directive index (alternative path) */
function forkPlan(rec, dirIndex) {
  const upto = rec.directives.slice(0, dirIndex + 1);
  const node = rec.directives[dirIndex];
  const ancestry = (rec.ancestry ? rec.ancestry.slice() : []).concat(upto.map(d => ({ prompt: d.prompt, reasoning: d.reasoning, branch: d.branch })));
  return newProject("Branch of “" + rec.title + "”", rec.repoUrl,
    { projId: rec.id, chainHash: node.chainHash, title: rec.title, author: rec.author || "unknown", mode: "plan" }, ancestry);
}
/* fork mode B: clone the whole trail to adapt the project your way */
function forkProject(rec) {
  const node = rec.directives[rec.directives.length - 1];
  const ancestry = (rec.ancestry ? rec.ancestry.slice() : []).concat(rec.directives.map(d => ({ prompt: d.prompt, reasoning: d.reasoning, branch: d.branch })));
  return newProject("Adaptation of “" + rec.title + "”", rec.repoUrl,
    { projId: rec.id, chainHash: node.chainHash, title: rec.title, author: rec.author || "unknown", mode: "project" }, ancestry);
}

/* ---------------- seal ---------------- */
function sealSVG(chainHex, ok, size) {
  const bytes = chainHex.match(/.{2}/g).slice(0, 12).map(h => parseInt(h, 16));
  const c = size / 2, rOut = c - 2, color = ok ? "var(--verified)" : "var(--danger)";
  let spokes = "";
  bytes.forEach((b, i) => {
    const a = (i / 12) * Math.PI * 2 - Math.PI / 2;
    const r1 = rOut * 0.3, r2 = rOut * (0.42 + (b / 255) * 0.5);
    spokes += `<line x1="${(c + Math.cos(a) * r1).toFixed(1)}" y1="${(c + Math.sin(a) * r1).toFixed(1)}" x2="${(c + Math.cos(a) * r2).toFixed(1)}" y2="${(c + Math.sin(a) * r2).toFixed(1)}" stroke="${color}" stroke-width="1.5" stroke-linecap="round"/>`;
  });
  return `<svg class="seal" viewBox="0 0 ${size} ${size}" width="${size}" height="${size}" role="img" aria-label="Provenance seal">
    <circle cx="${c}" cy="${c}" r="${rOut}" fill="none" stroke="${color}" stroke-width="1.3"/>
    <circle cx="${c}" cy="${c}" r="${rOut * 0.22}" fill="${color}"/>${spokes}</svg>`;
}

/* ---------------- helpers ---------------- */
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c])); }
const short = h => h ? h.slice(0, 10) : "";
const when = ts => new Date(ts).toLocaleDateString(undefined, { month: "short", day: "numeric" });
const PHASE_COLOR = { planning: "#B5651D", build: "#1F5E3A", polish: "#3A6B8A", ship: "#8A2D3B", "": "#59665E" };
const DEP_COLORS = ["#3A6B8A", "#8A2D3B", "#6B4E8A", "#1F5E3A", "#B5651D", "#59665E"];
/* dep tags land inside HTML attributes — keep them to safe chars by construction */
const depSan = s => String(s).replace(/[^\w@/.+:-]/g, "").slice(0, 40);
const SCAN_TTL = 10 * 60 * 1000; // ghCache "#scan"/"#pkg" entries stay fresh this long
async function copyText(text, label) {

  catch (e) { openModal(`<h3>Copy manually</h3><div class="mono-box">${esc(text)}</div><div class="btns"><button class="primary" onclick="OS.closeModal()">Done</button></div>`); }
}
function toast(m) { const t = $("toast"); t.textContent = m; t.style.display = "block"; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = "none", 2800); }
function openModal(h) { $("modal-root").innerHTML = `<div class="scrim" onclick="if(event.target===this)OS.closeModal()"><div class="dialog" role="dialog" aria-modal="true">${h}</div></div>`; }
function closeModal() { $("modal-root").innerHTML = ""; }

/* ---------------- agent brief (derived output — never touches the chain) ---------------- */
function briefVerified(p, d) {
  if (d.ghVerified) return { ok: true, sha: d.ghSha };
  const r = parseRepo(p.repoUrl);
  const c = r ? state.ghCache[r.owner + "/" + r.repo + "@" + d.branch] : null;
  return c && c.state === "verified" ? { ok: true, sha: c.sha } : { ok: false };
}
function buildBrief(p, fromIndex) {
  const dirs = p.directives.slice(fromIndex || 0);
  const r = parseRepo(p.repoUrl);
  const latestBranch = [...p.directives].map(d => d.branch).filter(Boolean).pop() || "";
  const k = dirs.filter(d => briefVerified(p, d).ok).length;
  let out = "# Agent brief — " + p.title + "\n";
  out += "Repo: " + (p.repoUrl || "(none)") + "   Current branch context: " + (latestBranch || "(none)") + "\n";
  out += "Generated " + new Date().toISOString() + " from the OPEN SOURCE ledger.\n\n";
  out += "## Directive chain (" + dirs.length + " nodes, verified: " + k + ")\n";
  dirs.forEach((d, i) => {
    const v = briefVerified(p, d);
    out += (i + 1) + ". [" + (d.phase || "unphased") + "] " + (d.branch || "no branch") + " — " + d.prompt + "\n";
    out += "   why: " + (d.reasoning || "(none)") + "   " + (v.ok ? "gh: verified @ " + short(v.sha) : "unverified") + "\n";
  });
  if (r) {
    const b = latestBranch || "main";
    out += "\n## Repo API entry points\n";
    out += "- Tree: https://api.github.com/repos/" + r.owner + "/" + r.repo + "/git/trees/" + b + "?recursive=1\n";
    out += "- Contents: https://api.github.com/repos/" + r.owner + "/" + r.repo + "/contents/?ref=" + b + "\n";
    out += "- Branch: https://github.com/" + r.owner + "/" + r.repo + "/tree/" + b + "\n";
  }
  const drafts = p.drafts || [];
  const qNotes = p.directives.filter(d => d.note && d.note.includes("?")).map(d => d.note.trim());
  if (drafts.length || qNotes.length) {
    out += "\n## Open threads\n";
    drafts.forEach(dr => { out += "- planned next: " + (dr.prompt || "").split("\n")[0] + (dr.branch ? " (" + dr.branch + ")" : "") + "\n"; });
    qNotes.forEach(n => { out += "- question from a margin note: " + n.split("\n")[0] + "\n"; });
  }
  out += "\n## Instruction to the agent\n";
  out += "Continue this project consistent with the chain above. Work on branch " + (latestBranch || "a new feature branch") + ". Keep changes scoped; state assumptions.\n";
  return out;
}

  }

  if (p.ancestry && p.ancestry.length && !isPub) html += `<div class="dir-target" style="margin:12px 0;font-style:italic">${p.ancestry.length} inherited directive${p.ancestry.length > 1 ? "s" : ""} carried in as lineage — your new directives chain onto the fork point.</div>`;

  if (!isPub && p.directives.length >= 15) {
    html += `<div class="bloat-warn">⚠ ${p.directives.length} directives — this project is getting long.
      Consider forking a fresh branch from a recent directive to keep each chain focused.
      <button class="ghost" onclick="OS.setPane('chain')">see the chain</button></div>`;
  }

  if (!isPub && state.paneMode === "notebook") {
    html += `<div class="notebook" style="margin-top:16px">
      <div class="dir-meta" style="margin-bottom:8px"><span class="dir-n">Notebook</span><span class="private-tag">PRIVATE — never published, never chained</span></div>
      <textarea id="nb-text" placeholder="Write to learn. What broke, what you'd prompt differently next time, patterns you're seeing across directives — this is your margin, not evidence. It stays on this device and is stripped from anything you publish.">${esc(p.journal || "")}</textarea>
      <div class="meta"><span>autosaves as you type</span><span id="nb-saved"></span></div>
    </div>`;
    pane.innerHTML = html;
    const nb = $("nb-text");
    if (nb) { let t; nb.addEventListener("input", () => { clearTimeout(t); t = setTimeout(() => OS.saveJournal(nb.value), 500); }); }
    return;
  }


  if (state.paneMode === "map") {
    const w = 720, cx = 46;
    const repo = parseRepo(p.repoUrl);
    const allTags = [...new Set(p.directives.flatMap(d => d.deps || []))];
    const tagColor = t => DEP_COLORS[allTags.indexOf(t) % DEP_COLORS.length];
    // vertical layout: optional fork-origin node, then chain nodes (taller rows
    // when a node carries dep chips), then outgoing fork stubs.
    let y = 36; const ys = [];
    let originY = null;
    if (p.forkOf && p.directives.length) { originY = y; y += 58; }
    p.directives.forEach(d => { ys.push(y); y += 58 + ((d.deps && d.deps.length) ? 24 : 0); });
    const forkRows = state.feed.filter(rec => rec.forkOf && rec.forkOf.projId === p.id).map(rec => {
      let idx = p.directives.findIndex(d => d.chainHash === rec.forkOf.chainHash);
      if (idx === -1) idx = p.directives.length - 1;
      const fy = y; y += 46;
      return { rec, idx, fy };
    });
    const H = y + 6;
    let svg = "";
    if (p.directives.length) {
      // min-width keeps labels legible on narrow screens; .graph-wrap scrolls the rest
      svg = `<svg viewBox="0 0 ${w} ${H}" width="100%" height="${H}" style="min-width:560px" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Project map: chain, forks, dependency tags">`;
      if (p.directives.length > 1) svg += `<line x1="${cx}" y1="${ys[0]}" x2="${cx}" y2="${ys[ys.length - 1]}" stroke="var(--line)" stroke-width="2"/>`;
      if (originY !== null) {
        const lbl = (p.forkOf.mode === "plan" ? "Branched from " : "Adapted from ") + "“" + p.forkOf.title + "”";
        svg += `<line x1="${cx}" y1="${originY}" x2="${cx}" y2="${ys[0]}" stroke="var(--amber)" stroke-width="1.5" stroke-dasharray="4 3"/>
          <circle cx="${cx}" cy="${originY}" r="8" fill="none" stroke="var(--amber)" stroke-width="1.5"/>
          <circle cx="${cx}" cy="${originY}" r="3" fill="var(--amber)"/>
          <text x="${cx + 22}" y="${originY + 4}" font-family="var(--sans)" font-size="12" font-style="italic" fill="var(--amber)">${esc(lbl.slice(0, 72))}</text>`;
      }
      // shared-tag edges: one lane per tag, left of the spine, tag-accent colored
      allTags.forEach((t, ti) => {
        const hits = p.directives.map((d, i) => (d.deps || []).includes(t) ? i : -1).filter(i => i !== -1);
        if (hits.length < 2) return;
        const lx = cx - 16 - (ti % 4) * 7, col = tagColor(t);
        svg += `<g class="dep-e dep-e-${ti}"><line x1="${lx}" y1="${ys[hits[0]]}" x2="${lx}" y2="${ys[hits[hits.length - 1]]}" stroke="${col}" stroke-width="1.5"/>`;
        hits.forEach(i => { svg += `<line x1="${lx}" y1="${ys[i]}" x2="${cx - 9}" y2="${ys[i]}" stroke="${col}" stroke-width="1.5"/>`; });
        svg += `</g>`;
      });
      p.directives.forEach((d, i) => {
        const ny = ys[i];
        const color = PHASE_COLOR[d.phase || ""] || PHASE_COLOR[""];
        const label = (d.prompt || "").slice(0, 58);
        const branch = d.branch ? "⎇ " + d.branch : "no branch";
        svg += `<g class="gph-node" onclick="OS.jumpDirective('${d.chainHash.slice(0, 12)}')">
          <circle cx="${cx}" cy="${ny}" r="9" fill="${color}"/>
          <circle cx="${cx}" cy="${ny}" r="4" fill="var(--card)"/>
          <text x="${cx + 22}" y="${ny - 4}" font-family="var(--sans)" font-size="13" font-weight="600" fill="var(--ink)">${i + 1}. ${esc(label)}</text>
          <text x="${cx + 22}" y="${ny + 13}" font-family="var(--mono)" font-size="10.5" fill="${color}">${d.phase ? d.phase.toUpperCase() + " · " : ""}${esc(branch)}</text>
        </g>`;
        if (!isPub) {
          const sel = state.mapSel === d.chainHash;
          svg += `<text class="map-sel" x="${w - 74}" y="${ny + 4}" font-family="var(--mono)" font-size="9.5" fill="${sel ? "var(--amber)" : "var(--slate)"}" onclick="OS.mapSelect('${d.chainHash}')">${sel ? "[selected]" : "[select]"}</text>`;

          svg += `<g class="map-sel" onmouseenter="OS.hlDep(${ti},1)" onmouseleave="OS.hlDep(${ti},0)">

      });

    }

    const pkgKey = repo ? repo.owner + "/" + repo.repo + "#pkg" : "";
    const pkg = pkgKey ? state.ghCache[pkgKey] : null;
    html += `<div class="graph-wrap">
      <div class="graph-legend">${["planning", "build", "polish", "ship"].filter(ph => usedPhases.includes(ph)).map(ph => `<span><i style="background:${PHASE_COLOR[ph]}"></i>${ph}</span>`).join("")}${usedPhases.includes("") && p.directives.length ? `<span><i style="background:${PHASE_COLOR[""]}"></i>unphased</span>` : ""}${allTags.map(t => `<span><i style="background:${tagColor(t)}"></i>${esc(t)}</span>`).join("")}</div>
      ${svg || '<div class="empty">No directives yet — the map fills as you chain them.</div>'}
      ${!isPub && repo ? `<div style="margin-top:12px"><button class="ghost" id="pkg-btn" onclick="OS.loadPkg()">Load package.json</button></div>` : ""}

      ${!isPub && p.directives.length ? `<div class="hint">Click a node to jump to its directive. Use [select] on a node, then click a dependency above (or add one on the directive card) to tag it — tags stay local and unchained.</div>` : ""}
    </div>`;
    pane.innerHTML = html;

  }

  p.directives.forEach((d, i) => {
    const ghKey = (parseRepo(p.repoUrl) ? parseRepo(p.repoUrl).owner + "/" + parseRepo(p.repoUrl).repo : "") + "@" + d.branch;

    if (state.paneMode === "chain") {

    } else {
      html += `<div class="dir" id="d-${d.chainHash.slice(0, 12)}">

        <div class="dir-main">

          ${!isPub ? `<div class="margin-note"><span class="lbl">Margin note — what you learned here (private)</span>
            <textarea id="mn-${d.chainHash.slice(0, 12)}" placeholder="Add a note…" oninput="OS.saveNote('${d.chainHash}', this.value)">${esc(d.note || "")}</textarea></div>` : (d.note ? `<div class="margin-note"><span class="lbl">Margin note</span><div style="font-style:italic;font-size:14px">${esc(d.note)}</div></div>` : "")}
          ${!isPub ? `<div style="margin-top:8px">${(d.deps || []).map(t => `<span class="dep-chip">${esc(t)}<b onclick="OS.rmDep('${d.chainHash}','${depSan(t)}')" title="remove dep">✕</b></span>`).join("")}<input class="dep-add" placeholder="+ dep, comma to add" spellcheck="false" aria-label="Add dependency tag" onkeydown="OS.depKey('${d.chainHash}',event,this)"></div>` : ""}
          <div class="dir-actions">
            ${p.repoUrl && d.branch ? `<button class="ghost" onclick="OS.verifyBranch('${p.id}',${i})">verify against GitHub</button>` : ""}
            <button class="ghost" onclick="OS.copyDirective('${p.id}',${i})">copy prompt</button>
            <button class="ghost" onclick="OS.permalink('${p.id}','${d.chainHash}')">copy link</button>
            <button class="ghost" onclick="OS.agentBrief(${i})">brief from here</button>
            ${isPub ? `<button class="amber" onclick="OS.doForkPlan('${p.id}',${i})">branch the plan →</button>` : ""}
          </div>
        </div></div>`;
    }
  });

  // Fixed ship-checklist under every project (per-project, private, unchained).
  const CHECK_ITEMS = [
    "Tested before ship — verified it runs, caught my own bugs",
    "Docs match reality — described only what exists, no aspirational claims",
    "Every number traces to a real run — no hand-waved metrics",
    "Fail-closed checked — verified the failure path, not just the happy path",
  ];
  const checks = p.checklist || {};
  const doneCount = CHECK_ITEMS.filter((_, i) => checks[i]).length;
  const tick = `<svg viewBox="0 0 20 20" width="12" height="12"><path d="M4 10l4 4 8-9" fill="none" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
  html += `<div class="checklist">
    <h4>Ship checklist</h4>
    <div class="cl-sub">${isPub ? "The author's discipline gate for this project." : "Your discipline gate — tap to check. Private, never chained, stripped on publish."}</div>
    ${CHECK_ITEMS.map((t, i) => `<div class="cl-item ${checks[i] ? "done" : ""}" ${isPub ? "" : `onclick="OS.toggleCheck(${i})"`}>
      <div class="cl-box">${tick}</div><div class="cl-text">${esc(t)}</div></div>`).join("")}
    <div class="cl-progress">${doneCount}/4 cleared${doneCount === 4 ? " — ready to push" : ""}</div>
  </div>`;

  // Staged drafts (scan output): editable, unchained, private — same fields as
  // the composer. Chaining one goes through the exact appendDirective path.
  if (!isPub && p.drafts && p.drafts.length) {
    html += `<div style="margin-top:26px"><div class="eyebrow" style="margin-bottom:10px">Staged drafts (${p.drafts.length})</div>`;
    for (const dr of p.drafts) {
      html += `<div class="draft-card">
        <span class="eyebrow">Staged draft — not chained</span>
        <div class="grid" style="display:grid;gap:10px">
          <div class="field"><label>The prompt you'll give your agent</label>
            <textarea style="min-height:56px;font-family:var(--mono);font-size:12.5px" oninput="OS.updDraft('${dr.id}','prompt',this.value)">${esc(dr.prompt || "")}</textarea></div>
          <div class="field"><label>Reasoning — why this change</label>
            <textarea style="min-height:44px" oninput="OS.updDraft('${dr.id}','why',this.value)">${esc(dr.why || "")}</textarea></div>
          <div class="field"><label>Target branch</label>
            <div class="branch-row"><input class="mono" value="${esc(dr.branch || "")}" spellcheck="false" oninput="OS.updDraft('${dr.id}','branch',this.value)">
            <select style="max-width:130px;font-family:var(--sans);font-size:13px" onchange="OS.updDraft('${dr.id}','phase',this.value)"><option value="">no phase</option>${["planning", "build", "polish", "ship"].map(ph => `<option value="${ph}"${dr.phase === ph ? " selected" : ""}>${ph[0].toUpperCase() + ph.slice(1)}</option>`).join("")}</select>
            <button class="primary" onclick="OS.chainDraft('${dr.id}')">Chain it</button>
            <button class="ghost" onclick="OS.discardDraft('${dr.id}')">Discard</button></div></div>
        </div></div>`;
    }
    html += `</div>`;
  }

  if (!isPub) {
    html += `<div class="composer"><div class="eyebrow" style="margin-bottom:10px">Log a directive</div><div class="grid">
      <div class="field"><label>The prompt you gave your agent</label>
        <textarea id="c-prompt" style="min-height:70px;font-family:var(--mono);font-size:13px" placeholder="e.g. Refactor the auth middleware to reject expired sessions on refresh, add a regression test."></textarea></div>
      <div class="field"><label>Reasoning — why this change</label>
        <textarea id="c-why" style="min-height:52px" placeholder="e.g. Sessions weren't being revalidated on token refresh; this closes the hole and locks it with a test."></textarea></div>
      <div class="field"><label>Target branch</label>
        <div class="branch-row"><input id="c-branch" class="mono" placeholder="fix/session-refresh" spellcheck="false">
        <select id="c-phase" style="max-width:130px;font-family:var(--sans);font-size:13px"><option value="">no phase</option><option value="planning">Planning</option><option value="build">Build</option><option value="polish">Polish</option><option value="ship">Ship</option></select>
        <button class="primary" onclick="OS.addDirective()">Chain it</button></div></div>
    </div><div class="hint">The prompt + reasoning + branch become one signed node. Map real branches so readers can verify against GitHub.</div></div>`;
  }
  pane.innerHTML = html;
}

  openPub: (id) => { state.view = "project"; state.openId = id; state.openIsPub = true; state.paneMode = "directives"; document.body.classList.add("in-project"); renderAll(); window.scrollTo(0, 0); },

  guide: () => {
    openModal(`<h3>Guide</h3>
      <div style="max-height:60vh;overflow-y:auto;padding-right:6px">

      <p style="font-weight:700;margin-top:4px">What do I do when a branch won't verify?</p>
      <p>A red <strong>✕ branch not found</strong> means the check worked and the branch genuinely isn't on GitHub right now. Walk it in order:</p>
      <p>1. <strong>Typo?</strong> The branch name is case- and slash-sensitive. <span class="mono">Fix/Auth</span> ≠ <span class="mono">fix/auth</span>. Re-log the directive with the exact name.<br>
      2. <strong>Never pushed?</strong> A local branch that only exists on your machine can't be verified. Push it, then verify.<br>
      3. <strong>Deleted or merged-and-pruned?</strong> If the branch was merged and deleted, it's gone from GitHub — that's why directive 4's <span class="mono">claude/…-422</span> shows not-found. Point the directive at the commit's permanent home instead: use the <strong>merge commit</strong> or the branch it merged into (usually <span class="mono">main</span>), since the work still lives there.<br>
      4. <strong>Private or renamed repo?</strong> Verification is public-API only. A private repo reads as "repo not found." Make it public, or accept that private-repo branches stay unverified.<br>
      5. <strong>Rate-limited?</strong> If the badge says "rate limit hit," GitHub caps anonymous checks at 60/hour per IP. Wait for the reset shown and re-verify.</p>
      <p class="dim" style="font-style:italic">The honest rule: an unverifiable branch doesn't weaken the chain — the signature still proves your trail wasn't altered. Branch verification is the extra layer that ties a directive to <em>public</em> work. No public branch, no green check, and that's fine for private or squashed history.</p>

      <p style="font-weight:700;margin-top:14px">Where does my work live? Can others see it?</p>
      <p>Everything is stored in <strong>this browser only</strong> (localStorage). Your projects, notes, journal, and checklists never leave your device. Other people opening this page see only the built-in seed project — never yours, and you never see theirs. "Published" here means "saved to this browser's published section," not shared to a server. Use <strong>Export all</strong> regularly; clearing your browser data wipes everything.</p>

      <p style="font-weight:700;margin-top:14px">Branch the plan vs adapt the project?</p>
      <p><strong>Branch the plan</strong> forks from one directive to try a different approach from that point. <strong>Adapt the project</strong> clones the whole trail to steer it your way. Both inherit signed lineage showing what they started from.</p>

      <p style="font-weight:700;margin-top:14px">What's private vs public when I publish?</p>
      <p>Chained + published: prompt, reasoning, branch, hashes, signature. Never published: margin notes, the Notebook, and the ship checklist — private by construction, stripped automatically.</p>

      <p style="font-weight:700;margin-top:14px">Manage a project (archive vs delete)?</p>
      <p><strong>Archive</strong> hides a project from the main list but keeps it — reversible, nothing lost. <strong>Delete</strong> is permanent: localStorage is the only copy and there's no server backup, so the app makes you type the project's name to confirm. Deleting a local draft does not by itself remove a published record of the same project — open the published version from the ledger and delete it there too if you want it gone entirely (the built-in seed project is the one exception; it isn't yours to delete). Keyboard: the wordmark is Home, <span class="mono">Esc</span> or <span class="mono">Alt+←</span> steps back to the ledger, and <span class="mono">j</span>/<span class="mono">k</span> jump between directives inside a project.</p>

      <p style="font-weight:700;margin-top:14px">Scan, Map, Briefs</p>
      <p><strong>Scan repo</strong> reads a connected repo's branches and recent commits (two API calls, cached ten minutes) and stages them as editable drafts — nothing is chained until you press Chain it on a draft. The <strong>Map</strong> tab draws the chain with its fork lineage and lets you tag directives with dependencies; tags stay local and unchained, and Load package.json can suggest them from the repo itself. <strong>Agent brief</strong> packages the ledger — chain, verification state, open drafts — as paste-ready context for your next AI session, as text or JSON. A brief is derived output only; generating one never touches the chain.</p>

      <p style="font-weight:700;margin-top:18px">Git commands — operating a repo properly.</p>
      <p>The chain in this app maps directives to branches. These are the actual commands that make and push the work behind each directive.</p>

      <p style="font-weight:600;margin-top:10px">Daily loop</p>
      <p><span class="mono">git status</span> — see what changed before you do anything.<br>
      <span class="mono">git add &lt;file&gt;</span> — stage a specific file. (Never <span class="mono">git add .</span> blindly — you'll commit junk and secrets.)<br>
      <span class="mono">git commit -m "clear message"</span> — commit staged changes with a real message.<br>
      <span class="mono">git push</span> — send commits to GitHub.<br>
      <span class="mono">git pull</span> — get others' (or another machine's) changes before you start.</p>

      <p style="font-weight:600;margin-top:10px">Branches (the unit this app maps to)</p>
      <p><span class="mono">git checkout -b feature/thing</span> — create and switch to a new branch.<br>
      <span class="mono">git checkout main</span> — switch back to main.<br>
      <span class="mono">git branch</span> — list local branches; <span class="mono">git branch -a</span> includes remote.<br>
      <span class="mono">git push -u origin feature/thing</span> — push a new branch and track it. <strong>This is what makes a branch verifiable here</strong> — a branch that only exists locally can't be checked.<br>
      <span class="mono">git merge feature/thing</span> — merge a branch into your current one.</p>

      <p style="font-weight:600;margin-top:10px">Fixing / backtracking (careful)</p>
      <p><span class="mono">git diff</span> — see unstaged changes; <span class="mono">git diff --staged</span> for staged.<br>
      <span class="mono">git restore &lt;file&gt;</span> — discard unstaged changes to a file (can't be undone).<br>
      <span class="mono">git reset --soft HEAD~1</span> — undo the last commit, keep the changes staged.<br>
      <span class="mono">git revert &lt;commit&gt;</span> — make a new commit that undoes an old one (safe, keeps history).<br>
      Note: avoid <span class="mono">git reset --hard</span> unless you're certain — it deletes work permanently.</p>

      <p style="font-weight:600;margin-top:10px">Connecting a repo</p>
      <p><span class="mono">git clone &lt;url&gt;</span> — copy a repo locally.<br>
      <span class="mono">git remote -v</span> — see where "origin" points.<br>
      <span class="mono">git remote add origin &lt;url&gt;</span> — connect a local repo to GitHub.</p>

      <p style="font-weight:600;margin-top:10px">GitHub Pages for this app</p>
      <p>Put the file at <span class="mono">/docs/index.html</span>, push to <span class="mono">main</span>, then Settings → Pages → Deploy from branch → <span class="mono">main</span> / <span class="mono">/docs</span>.<br>
      After a change: <span class="mono">git add docs/index.html &amp;&amp; git commit -m "update app" &amp;&amp; git push</span> — Pages redeploys in ~1 minute.</p>

      <p class="dim" style="font-style:italic;margin-top:10px">The chain in this app proves your directive trail wasn't altered; these commands are how the actual code behind each directive gets made and pushed.</p>

      </div>
      <div class="btns"><button class="primary" onclick="OS.closeModal()">Got it</button></div>`);
  },

  /* ---- scan repo -> staged drafts (never auto-chained) ---- */
  scanRepo: async (force) => {
    const p = currentProject(); if (!p || state.openIsPub) return;
    const r = parseRepo(p.repoUrl); if (!r) { toast("connect a valid GitHub repo first"); return; }
    const key = r.owner + "/" + r.repo + "#scan";
    const cached = state.ghCache[key];
    if (!force && cached && Date.now() - cached.at < SCAN_TTL) { OS.scanReview(r, cached); return; }
    const btn = $("scan-btn");
    if (btn) { btn.disabled = true; btn.innerHTML = '<span class="spin"></span>scanning'; }
    const reset = () => { const b = $("scan-btn"); if (b) { b.disabled = false; b.textContent = "Scan repo"; } };
    try {
      // Exactly two requests, bare GETs (see checkBranch on why no headers).
      const base = "https://api.github.com/repos/" + r.owner + "/" + r.repo;
      const [bRes, cRes] = await Promise.all([
        fetch(base + "/branches?per_page=30"),
        fetch(base + "/commits?per_page=30"),
      ]);
      if ([bRes.status, cRes.status].some(s => s === 403 || s === 429)) { toast("GitHub rate limit hit — try again in a bit"); reset(); return; }
      if (bRes.status === 404 || cRes.status === 404) { toast("repo not found (private or renamed?)"); reset(); return; }
      if (!bRes.ok || !cRes.ok) { toast("GitHub returned " + (bRes.ok ? cRes.status : bRes.status)); reset(); return; }
      const data = { at: Date.now(), branches: await bRes.json(), commits: await cRes.json() };
      state.ghCache[key] = data;
      reset(); OS.scanReview(r, data);
    } catch (e) { toast("couldn't reach GitHub (network offline?)"); reset(); }
  },
  scanReview: (repo, data) => {
    const branches = Array.isArray(data.branches) ? data.branches : [];
    const commits = Array.isArray(data.commits) ? data.commits : [];
    const msgBySha = {};
    commits.forEach(c => { if (c && c.sha) msgBySha[c.sha] = ((c.commit && c.commit.message) || "").split("\n")[0]; });
    // The commits list follows the default branch, so its tip sha identifies it.
    const tipSha = commits.length ? commits[0].sha : null;
    const atTip = branches.filter(b => b.commit && b.commit.sha === tipSha);
    const def = atTip.find(b => b.name === "main" || b.name === "master") || atTip[0]
      || branches.find(b => b.name === "main" || b.name === "master") || null;
    const defName = def ? def.name : "";
    const rows = [];
    branches.filter(b => b.name !== defName).forEach(b => rows.push({ kind: "branch", branch: b.name, msg: msgBySha[(b.commit && b.commit.sha) || ""] || "", checked: true }));
    commits.slice(0, 8).forEach(c => rows.push({ kind: "commit", branch: defName, sha: c.sha || "", msg: ((c.commit && c.commit.message) || "").split("\n")[0], checked: false }));
    state._scanRows = rows;
    if (!rows.length) { toast("Nothing to stage — the scan found no branches or commits"); return; }
    const age = Math.round((Date.now() - data.at) / 60000);
    const row = (x, i) => `<div class="scan-row" onclick="if(event.target.tagName!=='INPUT'){const c=this.querySelector('input');c.checked=!c.checked;OS.scanCount()}">
      <input type="checkbox" data-i="${i}"${x.checked ? " checked" : ""} onchange="OS.scanCount()" aria-label="Stage ${esc(x.branch || x.sha || "row")}">
      <div><div class="b">⎇ ${esc(x.branch || "?")}${x.sha ? ` <span class="dim">@ ${esc(x.sha.slice(0, 7))}</span>` : ""}</div>
      ${x.msg ? `<div class="c">${esc(x.msg.slice(0, 110))}</div>` : ""}</div></div>`;
    const bRows = rows.map((x, i) => x.kind === "branch" ? row(x, i) : "").join("");
    const cRows = rows.map((x, i) => x.kind === "commit" ? row(x, i) : "").join("");
    openModal(`<h3>Scan — ${esc(repo.owner + "/" + repo.repo)}</h3>
      <p class="dim" style="font-size:12.5px">Everything below stages as an <strong>editable draft</strong> — nothing touches the chain until you chain it yourself.${age >= 1 ? " Results cached " + age + " min ago." : ""}</p>
      ${bRows ? `<div class="eyebrow" style="margin:10px 0 2px">Branches${defName ? " — default “" + esc(defName) + "” excluded" : ""}</div>` + bRows : `<p class="dim" style="font-style:italic">No non-default branches found.</p>`}
      ${cRows ? `<div class="eyebrow" style="margin:14px 0 2px">Recent ${esc(defName || "default")} commits (optional)</div>` + cRows : ""}
      <div class="btns"><button class="ghost" onclick="OS.closeModal();OS.scanRepo(true)">Re-scan</button>
        <button class="ghost" onclick="OS.closeModal()">Cancel</button>
        <button class="primary" id="scan-stage" onclick="OS.stageDrafts()">Stage</button></div>`);
    OS.scanCount();
  },

  /* ---- agent brief (derived output only) ---- */
  agentBrief: (fromIndex) => {
    const p = currentProject(); if (!p || !p.directives.length) return;
    const from = fromIndex || 0;
    const text = buildBrief(p, from);
    const r = parseRepo(p.repoUrl);
    const latestBranch = [...p.directives].map(d => d.branch).filter(Boolean).pop() || "main";
    OS._brief = {
      text,
      json: {
        kind: "vibe-ledger-agent-brief", version: 1,
        project: { title: p.title, repoUrl: p.repoUrl || "" },
        directives: p.directives.slice(from).map(d => {
          const v = briefVerified(p, d);
          return { prompt: d.prompt, why: d.reasoning, branch: d.branch, phase: d.phase || "", ghVerified: v.ok, ghSha: v.sha || "" };
        }),
        drafts: (p.drafts || []).map(dr => ({ prompt: dr.prompt, why: dr.why, branch: dr.branch, phase: dr.phase || "" })),
        links: r ? {
          tree: "https://api.github.com/repos/" + r.owner + "/" + r.repo + "/git/trees/" + latestBranch + "?recursive=1",
          contents: "https://api.github.com/repos/" + r.owner + "/" + r.repo + "/contents/?ref=" + latestBranch,
          branch: "https://github.com/" + r.owner + "/" + r.repo + "/tree/" + latestBranch,
        } : {},
      },
    };
    openModal(`<h3>Agent brief${from ? " — from directive " + (from + 1) : ""}</h3>
      <p class="dim" style="font-size:12px">Derived output only — generating this never touches the chain. Paste it into your next AI session.</p>
      <div class="mono-box brief-box">${esc(text)}</div>
      <div class="btns"><button class="ghost" onclick="OS.exportBriefJSON()">Export JSON</button>
        <button class="primary" onclick="OS.copyBrief()">Copy brief</button></div>`);
  },
  copyBrief: () => { if (OS._brief) copyText(OS._brief.text, "Agent brief copied"); },
  exportBriefJSON: () => {
    if (!OS._brief) return;
    const blob = new Blob([JSON.stringify(OS._brief.json, null, 2)], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = "vibe-ledger-agent-brief-" + new Date().toISOString().slice(0, 10) + ".json";
    document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
    toast("Agent brief JSON exported");
  },

  confirmPublish: () => {
    const p = currentProject(); if (!p || !p.directives.length) return;
    openModal(`<h3>Publish this project?</h3>
      <p><strong>Publishing is public.</strong> Everyone with this artifact can read your directive trail, verify it, branch a plan, or adapt the whole project. Your handle <span class="mono">${esc(state.local.handle)}</span> and a device signature are attached.</p>
      <p>Chain head to be signed:</p><div class="mono-box">${p.directives[p.directives.length - 1].chainHash}</div>
      <p class="dim" style="font-style:italic;font-size:12px">Don't publish secrets or private prompts. Published trails are permanent to readers.</p>
      <div class="btns"><button class="ghost" onclick="OS.closeModal()">Keep private</button><button class="primary" onclick="OS.publish()">Sign &amp; publish</button></div>`);
  },
  publish: async () => {
    closeModal(); const p = currentProject(); if (!p) return;
    try { const rec = await publishProject(p); toast("Published — sealed at " + short(rec.headChain)); await loadFeed(); state.openIsPub = true; state.openId = rec.id; renderAll(); }
    catch (e) { toast("Publish failed: " + e.message); }
  },
  doForkPlan: (pid, i) => {
    const rec = state.feed.find(r => r.id === pid); if (!rec) return;
    const p = forkPlan(rec, i); saveLocal();
    state.view = "project"; state.openId = p.id; state.openIsPub = false; state.paneMode = "directives"; document.body.classList.add("in-project");
    renderAll(); toast("Branched the plan — your directives chain onto node " + short(rec.directives[i].chainHash));
  },
  doForkProject: (pid) => {
    const rec = state.feed.find(r => r.id === pid); if (!rec) return;
    const p = forkProject(rec); saveLocal();
    state.view = "project"; state.openId = p.id; state.openIsPub = false; state.paneMode = "directives"; document.body.classList.add("in-project");
    renderAll(); toast("Adapted the project — the whole trail is now yours to steer");
  },
  setHandle: async (v) => { state.local.handle = (v || "").trim().slice(0, 24) || state.local.handle; $("handle").value = state.local.handle; await saveLocal(); },
};
window.OS = OS;

/* ---------------- seed: ONE real connected project ----------------
   The Horos public-router build, told as the directive trail it actually
   was this week. Chains computed live at seed time so it verifies honestly.
   Branches are illustrative of the real work; readers can verify the repo. */
const HOROS_SEED = {
  title: "Horos → free public router",
  repo: "https://github.com/holeyfield33-art/horos",
  directives: [
    { prompt: "Replace the placeholder signing seed in mcp/router_runner.mjs. Read HOROS_KEY_SEED from env, require 64 hex chars, fail the runner if missing. The server must refuse to sign with a default identity.",
      why: "The live service was signing every receipt with an all-zeros key — a signature that proves nothing. This is the load-bearing fix: no real key, no real product.",
      branch: "main" },
    { prompt: "Add an unauthenticated POST /public/route to the Starlette app, carved out of the bearer wall like /healthz. Accept a public repo_url (primary) or a graph (fallback) plus a task; clone tokenless, generate, route, sign, return {summary, receipt}.",
      why: "The whole point of a public tool: a stranger pastes a repo and gets a signed receipt. GITHUB_TOKEN gated OFF here so anonymous callers can never reach private repos.",
      branch: "main" },
    { prompt: "Lock CORS on /public/route to the GitHub Pages origin only. Handle OPTIONS preflight. Do not relax CORS on /mcp or anything else.",
      why: "The browser UI lives on a different origin than the API; without an exact allow-origin match the calls fail. Everything else stays behind the bearer wall.",
      branch: "main" },
    { prompt: "Classify RouteError into actionable 4xx messages instead of a bare 422. no_entrypoints / empty_selection → a clear 'try a more specific task or confirm the repo has analyzable files' message. Surface the error text in the Pages UI.",
      why: "A valid public repo that routes empty was returning a naked 422 with no reason. A public endpoint that rejects input must say why — fail closed, but fail legibly.",
      branch: "claude/horos-public-route-422-x2ipgl" },
  ],
};
// The app's own directive trail — this file, told as the ledger it records.
const META_SEED = {
  title: "OPEN SOURCE → navigation, guarded delete, Git guide",
  repo: "https://github.com/holeyfield33-art/open-source",
  directives: [
    { prompt: "Make the wordmark a keyboard-accessible Home control (goFeed), mark the open project with an .active border in the rail, and add Alt+ArrowLeft back plus j/k directive jumps — all respecting the existing typing guard.",
      why: "Location was invisible once inside a project and there was no cheap way home. Navigation should never be a guess; the rail should always say where you are.",
      branch: "claude/open-source-nav-delete-guide-tl13q5" },
    { prompt: "Add permanent project deletion, guarded so it can't be a one-click accident: require typing the exact project name to enable Delete, nudge toward reversible Archive, and only offer it on local/private projects — never the seed or published records.",
      why: "localStorage is the only copy — no server, no undo. Test projects piled up and looked messy, but a bare 'are you sure' on irreversible loss isn't enough of a gate.",
      branch: "claude/open-source-nav-delete-guide-tl13q5" },
    { prompt: "Add a 'Git commands — operating a repo properly' section to the in-app Guide, grouped into daily loop, branches, backtracking, connecting a repo, and GitHub Pages, in the guide's existing plain style.",
      why: "The app maps directives to branches but never taught the commands that actually make them. Close the loop between the ledger and the real Git work behind it.",
      branch: "claude/open-source-nav-delete-guide-tl13q5" },
  ],
};
async function publishSeed(spec) {
  const p = newProject(spec.title, spec.repo); p.seed = true;
  for (const d of spec.directives) await appendDirective(p, d.prompt, d.why, d.branch);
  try { await publishProject(p); } catch (e) { console.error("seed publish failed:", e); }
  // Seeds live only in the published feed, never as an editable local draft.
  delete state.local.projects[p.id];
  state.local.order = state.local.order.filter(id => id !== p.id);
}
async function seedIfNeeded() {
  // First-run seed of the Horos project — skipped if this browser already has published records.
  if (!state.local.seeded) {
    let hasKeys = false;
    try { const ex = await storage.list("proj:"); hasKeys = !!(ex && ex.keys && ex.keys.length); } catch (e) {}
    if (!hasKeys) await publishSeed(HOROS_SEED);
    state.local.seeded = true; await saveLocal();
  }
  // Meta seed: the directive trail behind this app's own navigation/delete/guide work.
  // Guarded independently so existing installs pick it up once.
  if (!state.local.metaSeeded) {
    await publishSeed(META_SEED);
    state.local.metaSeeded = true; await saveLocal();
  }
}

/* ---------------- boot ---------------- */
(async function boot() {
  $("pane").innerHTML = `<div class="empty">Opening the ledger — loading keys, projects, and the public feed…</div>`;
  await loadLocal();
  state.kp = await loadOrCreateKeypair();
  if (!state.local.handle) { const pkh = await sha256hex(JSON.stringify(state.kp.pubJwk)); state.local.handle = "dev-" + pkh.slice(0, 6); await saveLocal(); }
  $("handle").value = state.local.handle;
  $("handle").addEventListener("change", e => OS.setHandle(e.target.value));
  document.addEventListener("keydown", (e) => {
    // Escape: close a modal, blur a field, or step back to the ledger.
    if (e.key === "Escape") {
      if ($("modal-root").innerHTML) { closeModal(); return; }
      const a = document.activeElement;
      if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.isContentEditable)) { a.blur(); return; }
      if (state.view !== "feed") OS.goFeed();
      return;
    }
    // Everything below is a shortcut: never fire while typing, and never over a modal.
    if ($("modal-root").innerHTML) return;
    const a = document.activeElement;
    if (a && (a.tagName === "TEXTAREA" || a.tagName === "INPUT" || a.isContentEditable)) return;
    // Alt+ArrowLeft: back to the ledger from any project view.
    if (e.altKey && e.key === "ArrowLeft") {
      if (state.view !== "feed") { e.preventDefault(); OS.goFeed(); }
      return;
    }
    // j / k: jump to the next / previous directive card within an open project.
    if ((e.key === "j" || e.key === "k") && state.view === "project" && !e.metaKey && !e.ctrlKey && !e.altKey) {
      OS.stepDirective(e.key === "j" ? 1 : -1);
    }
  });
  await seedIfNeeded();
  await loadFeed();
  renderAll();
})();
})();
</script>
